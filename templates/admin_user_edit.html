{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h2 class="mb-0">Edit User</h2>
    <div class="text-muted">{{ edit_user.email }}</div>
  </div>

  <a href="{{ url_for('admin_users') }}" class="btn btn-secondary">Back</a>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <form method="post">

      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" name="email" class="form-control" value="{{ edit_user.email }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Set New Password</label>
        <input type="password" name="new_password" class="form-control" placeholder="Leave blank to keep current password">
        <div class="form-text">Setting a password will force a password change on next login.</div>
      </div>

      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" name="is_active_user" value="1" id="isActive" {% if edit_user.is_active_user %}checked{% endif %}>
        <label class="form-check-label" for="isActive">User Enabled</label>
      </div>

      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" name="is_admin" value="1" id="isAdmin" {% if edit_user.is_admin %}checked{% endif %}>
        <label class="form-check-label" for="isAdmin">Admin</label>
      </div>

      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" name="is_super_admin" value="1" id="isSuperAdmin" {% if edit_user.is_super_admin %}checked{% endif %}>
        <label class="form-check-label" for="isSuperAdmin">Super Admin</label>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" name="must_change_password" value="1" id="forceReset" {% if edit_user.must_change_password %}checked{% endif %}>
        <label class="form-check-label" for="forceReset">Force Password Change</label>
      </div>

      <button type="submit" class="btn btn-primary">Save User</button>

    </form>
  </div>
</div>
{% endblock %}
