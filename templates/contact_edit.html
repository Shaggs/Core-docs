{% extends "base.html" %}{% block content %}<h2 class="mb-3">{% if contact %}Edit Contact{% else %}Add Contact{% endif %}</h2><div class="card shadow-sm p-3" style="max-width:860px;"><form method="post"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">First Name</label><input class="form-control" name="first_name" required value="{{ contact.first_name if contact else '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Last Name</label><input class="form-control" name="last_name" required value="{{ contact.last_name if contact else '' }}"></div></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ contact.email if contact else '' }}"></div><div class="col-md-3 mb-3"><label class="form-label">Mobile</label><input class="form-control" name="mobile" value="{{ contact.mobile if contact else '' }}"></div><div class="col-md-3 mb-3"><label class="form-label">Office</label><input class="form-control" name="office" value="{{ contact.office if contact else '' }}"></div></div><div class="row"><div class="col-md-8 mb-3"><label class="form-label">Position</label><input class="form-control" name="position" value="{{ contact.position if contact else '' }}"></div><div class="col-md-4 mb-3 form-check mt-4"><input class="form-check-input" type="checkbox" name="is_decision_maker" {% if contact and contact.is_decision_maker %}checked{% endif %} id="dm"><label for="dm" class="form-check-label">Decision maker</label></div></div><div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" rows="3" name="notes">{{ contact.notes if contact else '' }}</textarea></div><button class="btn btn-success">{% if contact %}Save Changes{% else %}Add Contact{% endif %}</button><a href="{{ url_for('contacts_list') }}" class="btn btn-secondary">Cancel</a></form></div>{% endblock %}
