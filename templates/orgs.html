{% extends "base.html" %}{% block content %}<h2 class="mb-3">Organisations</h2><div class="d-flex justify-content-between mb-3"><div class="text-muted">Select an organisation to work in.</div><a href="{{ url_for('org_new') }}" class="btn btn-primary">Add Organisation</a></div><div class="card shadow-sm"><div class="list-group list-group-flush">{% for o in orgs %}<a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" href="{{ url_for('org_view', org_id=o.id) }}"><span>{{ o.name }}</span><span class="text-muted small">{{ o.description or "" }}</span></a>{% else %}<div class="p-3 text-muted">No organisations yet.</div>{% endfor %}</div></div>{% endblock %}
