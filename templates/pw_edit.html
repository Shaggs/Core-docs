{% extends "base.html" %}{% block content %}<h2 class="mb-3">{% if row %}Edit Password{% else %}Add Password{% endif %}</h2><div class="card shadow-sm p-3" style="max-width:820px;"><form method="post"><div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required value="{{ row.name if row else '' }}"></div><div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" value="{{ row.username_plain if row else '' }}"></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" name="password" value="{{ row.password_plain if row else '' }}"></div><div class="mb-3"><label class="form-label">URL</label><input class="form-control" name="url" value="{{ row.url if row else '' }}"></div><div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" rows="3" name="notes">{{ row.notes if row else '' }}</textarea></div><div class="mb-3"><label class="form-label">OTP Secret</label><input class="form-control" name="otp_secret" value="{{ row.otp_secret if row else '' }}"></div><button class="btn btn-success">{% if row %}Save Changes{% else %}Add Password{% endif %}</button><a href="{{ url_for('pw_list') }}" class="btn btn-secondary">Cancel</a></form></div>{% endblock %}
