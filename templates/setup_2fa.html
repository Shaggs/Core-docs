{% extends "base.html" %}

{% block content %}
<div class="container py-4" style="max-width: 760px;">
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="mb-3">Set Up MFA</h2>
      <p class="text-muted">
        Scan the QR code with Microsoft Authenticator, Google Authenticator, or another TOTP app.
        Then enter the 6-digit code below to confirm setup.
      </p>

      {% if qr_image %}
        <div class="text-center mb-4">
          <img src="{{ qr_image }}" alt="MFA QR Code" class="img-fluid border rounded p-2 bg-white" style="max-width: 260px;">
        </div>
      {% endif %}

      <div class="mb-3">
        <label class="form-label fw-semibold">Manual setup key</label>
        <input type="text" class="form-control" value="{{ secret }}" readonly>
        <div class="form-text">Use this if you cannot scan the QR code.</div>
      </div>

      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Verification code</label>
          <input type="text" name="code" class="form-control" placeholder="Enter 6-digit code" maxlength="6" required>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Enable MFA</button>
          <a href="{{ url_for('account') }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
