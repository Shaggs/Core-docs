{% extends "base.html" %}{% block content %}<div style="background:rgba(0,0,0,0.55);min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;border-radius:12px;background-image:url('{{ url_for('static', filename='img/coresight_login_background.png') }}');background-size:cover;background-position:center;"><div class="card shadow-sm p-4" style="width:100%;max-width:420px;background:rgba(255,255,255,0.95)"><div class="text-center mb-3"><img src="{{ url_for('static', filename='img/coresight_logo.png') }}" style="max-width:220px;"></div><h2 class="mb-3 text-center">Sign in</h2><form method="post"><div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div><button class="btn btn-primary w-100">Login</button></form><div class="mt-3 text-center"><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></div></div></div>{% endblock %}
