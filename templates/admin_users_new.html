{% extends "base.html" %}{% block content %}<h2 class="mb-3">Add User</h2><div class="card shadow-sm p-3" style="max-width:600px;"><form method="post"><div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div><div class="mb-3"><label class="form-label">Initial Password</label><input class="form-control" type="password" name="password" required></div><div class="form-check mb-2"><input class="form-check-input" type="checkbox" value="1" id="is_admin" name="is_admin"><label class="form-check-label" for="is_admin">Admin</label></div><div class="form-check mb-3"><input class="form-check-input" type="checkbox" value="1" id="is_super_admin" name="is_super_admin"><label class="form-check-label" for="is_super_admin">Super Admin</label></div><button class="btn btn-success">Create User</button><a href="{{ url_for('admin_users') }}" class="btn btn-secondary">Cancel</a></form></div>{% endblock %}
