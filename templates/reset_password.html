{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-6 col-lg-4">
<h2 class="mb-3">{% if welcome %}Choose your password{% else %}Reset Password{% endif %}</h2>
<div class="card shadow-sm p-3">
  {% if email %}<p class="small text-muted mb-3">Account: <strong>{{ email }}</strong></p>{% endif %}
  <form method="post">
    <div class="mb-3"><label class="form-label">New Password</label><input class="form-control" type="password" name="password" autocomplete="new-password" required>
      <div class="form-text">At least 10 characters, using 3 of: upper case, lower case, numbers, symbols.</div></div>
    <div class="mb-3"><label class="form-label">Confirm Password</label><input class="form-control" type="password" name="confirm_password" autocomplete="new-password" required></div>
    <button class="btn btn-success w-100">{% if welcome %}Set password{% else %}Reset Password{% endif %}</button>
  </form>
  <div class="mt-3 text-center"><a href="{{ url_for('login') }}">Back to login</a></div>
</div></div></div>{% endblock %}
