{% extends "base.html" %}{% block content %}<h2 class="mb-3">{% if site %}Edit Site{% else %}Add Site{% endif %}</h2><div class="card shadow-sm p-3" style="max-width:860px;"><form method="post"><div class="mb-3"><label class="form-label">Site Name</label><input class="form-control" name="site_name" required value="{{ site.site_name if site else '' }}"></div><div class="mb-3"><label class="form-label">Address 1</label><input class="form-control" name="address1" required value="{{ site.address1 if site else '' }}"></div><div class="mb-3"><label class="form-label">Address 2</label><input class="form-control" name="address2" value="{{ site.address2 if site else '' }}"></div><div class="row"><div class="col-md-4 mb-3"><label class="form-label">Suburb</label><input class="form-control" name="suburb" value="{{ site.suburb if site else '' }}"></div><div class="col-md-4 mb-3"><label class="form-label">State</label><input class="form-control" name="state" value="{{ site.state if site else '' }}"></div><div class="col-md-4 mb-3"><label class="form-label">Postcode</label><input class="form-control" name="postcode" value="{{ site.postcode if site else '' }}"></div></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Country</label><input class="form-control" name="country" value="{{ site.country if site else 'Australia' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Notes</label><input class="form-control" name="notes" value="{{ site.notes if site else '' }}"></div></div><button class="btn btn-success">{% if site %}Save Changes{% else %}Add Site{% endif %}</button><a href="{{ url_for('sites_list') }}" class="btn btn-secondary">Cancel</a></form></div>{% endblock %}
