{% extends "base.html" %}{% block content %}<h2 class="mb-3">{% if domain and (domain.id is defined) %}Edit Domain{% else %}Add Domain{% endif %}</h2><div class="card shadow-sm p-3" style="max-width:820px;"><form method="post" action="{{ url_for('domain_lookup') }}" class="mb-3"><div class="input-group"><input class="form-control" name="domain_name" placeholder="example.com" value="{{ domain.domain_name if domain else '' }}" required><button class="btn btn-outline-secondary" type="submit">Fetch from WHOIS</button></div><div class="form-text">Prefills registrar, DNS provider, nameservers, and expiry from WHOIS (not saved yet).</div></form>{% set is_existing = domain and (domain.id is defined) %}<form method="post" action="{{ url_for('domain_edit', domain_id=domain.id) if is_existing else url_for('domain_new') }}"><input type="hidden" name="domain_name" value="{{ domain.domain_name if domain else '' }}"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Registrar</label><input class="form-control" name="registrar" value="{{ domain.registrar if domain else '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">DNS Provider</label><input class="form-control" name="dns_provider" value="{{ domain.dns_provider if domain else '' }}"></div></div><div class="mb-3"><label class="form-label">Nameservers (one per line)</label><textarea class="form-control" rows="3" name="nameservers">{{ domain.nameservers if domain else '' }}</textarea></div><div class="mb-3"><label class="form-label">Expiry Date</label><input class="form-control" type="date" name="expires_on" value="{{ domain.expires_on if domain and domain.expires_on else '' }}"></div><div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" rows="3" name="notes">{{ domain.notes if domain else '' }}</textarea></div><button class="btn {% if is_existing %}btn-primary{% else %}btn-success{% endif %}">{% if is_existing %}Save Changes{% else %}Add Domain{% endif %}</button><a href="{{ url_for('domains_list') }}" class="btn btn-secondary">Cancel</a></form></div>{% endblock %}
