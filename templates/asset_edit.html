{% extends "base.html" %}{% block content %}<h2 class="mb-3">{% if asset %}Edit Asset{% else %}Add Asset{% endif %}</h2><div class="card shadow-sm p-3"><form method="post"><div class="mb-3"><label class="form-label">Device Name</label><input class="form-control" name="device_name" required value="{{ asset.device_name if asset else '' }}"></div><div class="mb-3"><label class="form-label">Device Type</label><select class="form-select" name="device_type">{% for t in device_types %}<option value="{{ t }}" {% if asset and asset.device_type == t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Brand</label><select class="form-select" name="brand">{% for b in brands %}<option value="{{ b }}" {% if asset and asset.brand == b %}selected{% endif %}>{{ b }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Date Purchased</label><input type="date" class="form-control" name="date_purchased" value="{{ asset.date_purchased.strftime('%Y-%m-%d') if asset and asset.date_purchased else '' }}"></div><div class="mb-3"><label class="form-label">Serial Number</label><input class="form-control" name="serial_number" value="{{ asset.serial_number if asset else '' }}"></div><div class="mb-3"><label class="form-label">Asset ID</label><input class="form-control" name="asset_id" value="{{ asset.asset_id if asset else '' }}"></div><div class="mb-3"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ asset.location if asset else '' }}"></div><div class="mb-3"><label class="form-label">Issued To</label><input class="form-control" name="issued_to" value="{{ asset.issued_to if asset else '' }}"></div><div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" rows="4" name="notes">{{ asset.notes if asset else '' }}</textarea></div><button class="btn btn-success">{% if asset %}Save Changes{% else %}Add Asset{% endif %}</button><a href="{{ url_for('assets') }}" class="btn btn-secondary">Cancel</a></form></div>{% endblock %}
