{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">{% if row %}Edit Document{% else %}New Document{% endif %}</h2>

<div class="card shadow-sm p-3">
  <form method="post" id="docPageForm">
    <input type="hidden" name="folder_id" value="{{ folder.id if folder else '' }}">
    <input type="hidden" name="body_html" id="body_html">

    <div class="mb-3">
      <label class="form-label">Title</label>
      <input class="form-control" name="title" required value="{{ row.title if row else '' }}">
    </div>

    <div class="mb-3">
      <label class="form-label">Folder</label>
      <input class="form-control" value="{{ folder.name if folder else 'Root' }}" readonly>
    </div>

    <div class="mb-3">
      <label class="form-label">Content</label>
      <div id="editor" style="height: 420px;">{{ body_html|safe }}</div>
    </div>

    <button class="btn btn-success">{% if row %}Save Changes{% else %}Create Document{% endif %}</button>
    {% if row %}
      <a href="{{ url_for('docs_page_view', page_id=row.id) }}" class="btn btn-secondary">Cancel</a>
    {% else %}
      <a href="{{ url_for('docs', folder=folder.id if folder else None) }}" class="btn btn-secondary">Cancel</a>
    {% endif %}
  </form>
</div>

<link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script>
  const quill = new Quill('#editor', {
    theme: 'snow',
    modules: {
      toolbar: [
        [{ header: [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ list: 'ordered' }, { list: 'bullet' }],
        [{ indent: '-1' }, { indent: '+1' }],
        ['blockquote', 'code-block'],
        ['link'],
        [{ align: [] }],
        ['clean']
      ]
    }
  });

  document.getElementById('docPageForm').addEventListener('submit', function () {
    document.getElementById('body_html').value = quill.root.innerHTML;
  });
</script>
{% endblock %}
