{% extends "base.html" %}

{% block content %}
<div class="container py-4" style="max-width: 760px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h2 class="mb-0">Edit Organisation</h2>
      <div class="text-muted">Update organisation details and Level group mapping.</div>
    </div>
    <a href="{{ url_for('org_view', org_id=org.id) }}" class="btn btn-outline-secondary">Back</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Organisation Name</label>
          <input type="text" name="name" class="form-control" value="{{ org.name }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Description</label>
          <textarea name="description" class="form-control" rows="4">{{ org.description or '' }}</textarea>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Level Group ID</label>
          <input type="text" name="level_group_id" class="form-control" value="{{ org.level_group_id or '' }}">
          <div class="form-text">Only Level devices matching this group ID will sync into this organisation.</div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Save Organisation</button>
          <a href="{{ url_for('org_view', org_id=org.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
