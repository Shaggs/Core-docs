{% extends "base.html" %}{% block content %}<h2 class="mb-3">Admin – SMTP Settings</h2><div class="row g-4"><div class="col-lg-7"><div class="card shadow-sm p-3"><form method="post"><input type="hidden" name="action" value="save"><div class="mb-3"><label class="form-label">SMTP Host</label><input class="form-control" name="host" value="{{ settings.host or '' }}" placeholder="smtp.office365.com"></div><div class="mb-3"><label class="form-label">Port</label><input class="form-control" type="number" name="port" value="{{ settings.port or 587 }}"></div><div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" value="{{ settings.username or '' }}"></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" placeholder="Leave blank to keep existing password"></div><div class="mb-3"><label class="form-label">From Email</label><input class="form-control" type="email" name="from_email" value="{{ settings.from_email or '' }}"></div><div class="form-check mb-2"><input class="form-check-input" type="checkbox" name="use_tls" id="use_tls" {% if settings.use_tls %}checked{% endif %}><label class="form-check-label" for="use_tls">Use TLS</label></div><div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="use_ssl" id="use_ssl" {% if settings.use_ssl %}checked{% endif %}><label class="form-check-label" for="use_ssl">Use SSL</label></div><button class="btn btn-success">Save Settings</button></form></div></div><div class="col-lg-5"><div class="card shadow-sm p-3"><h5>Send Test Email</h5><form method="post"><input type="hidden" name="action" value="test"><div class="mb-3"><label class="form-label">Send To</label><input class="form-control" type="email" name="test_to" placeholder="you@example.com"></div><button class="btn btn-primary">Send Test</button></form></div></div></div>{% endblock %}
